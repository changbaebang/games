<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>도토리 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud"><span>❤️ <b id="hLife">3</b></span><span>🪙 <b id="hCoin">0</b></span><span id="hLv">1-1</span><span>⏱ <b id="hTime">300</b></span></div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="big"></div>
<div class="help">←→ 이동 · Space/↑ 점프(길게 누르면 높이) · Shift 달리기 · X 불씨 던지기 · P 일시정지</div>
<div id="touch"><div id="stickZone"><div id="stick"><i></i></div></div><div class="tbtns"><button id="bF">불씨</button><button id="bJ">점프</button></div></div>

<div class="overlay" id="titleOv"><div class="card">
  <h1>도토리 대모험</h1>
  <p>다람쥐 <b>도리</b>와 함께 달리고 뛰어 <b>깃발</b>까지! 상자를 머리로 치면 코인과 <b>황금 도토리</b>가 나와요.</p>
  <p class="small">적은 위에서 밟아요. 달팽이 껍데기는 차면 쭉 미끄러져요. 불씨 열매를 먹으면 불씨를 던질 수 있어요!</p>
  <div class="lv" id="lvs"></div>
  <p class="small mob">왼쪽을 끌어 좌우로 움직이고(멀리 끌면 달리기), 오른쪽 버튼으로 점프·불씨.</p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card"><h2>일시정지</h2><div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">스테이지 고르기</button></div></div></div>
<div class="overlay" id="overOv" hidden><div class="card"><h1 id="oTitle">클리어!</h1><p id="oTxt"></p><div class="btns"><button class="btn" id="againBtn">다음</button><button class="btn soft" id="oMenu">스테이지 고르기</button></div></div></div>
<script src="game.js"></script>
</body></html>
