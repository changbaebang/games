<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>파고파고 고릴라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="game"></div>
<div class="hud"><span id="hearts"></span><span>보석 <b id="gems">0/4</b></span><span>바나나 <b id="nanas">0</b></span><span>금화 <b id="coins">0</b></span></div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="toast"></div>
<div id="chargeBar"><i></i></div>
<div class="help">WASD 이동 · Space 점프 · J 주먹(꾹 누르면 강펀치) · K 아래로 파기 · 드래그/←→ 시점 · P 일시정지</div>
<div id="touch"><div id="joy"><div id="knob"></div></div><button class="tb" id="tPunch">주먹</button><button class="tb" id="tDown">아래<br>파기</button><button class="tb" id="tJump">점프</button></div>
<div class="overlay" id="titleOv"><div class="card">
  <h1>파고파고 고릴라</h1>
  <p>힘센 고릴라 <b>쾅쾅이</b>가 섬을 주먹으로 부수며 파고 들어가요! 땅속에 숨은 <b>보석</b>을 모두 찾으면 더 깊은 층으로. 반짝이는 곳 아래를 파 보세요. 바나나를 먹으면 힘이 나요.</p>
  <p class="best">가장 깊이 간 층 <b id="tBest">0</b></p>
  <button class="btn" id="startBtn">쾅쾅 출발!</button>
  <p class="small mob">왼쪽 아래 조이스틱으로 이동, 오른쪽 화면을 끌어 시점 회전. 주먹을 꾹 누르면 강펀치!</p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card"><h2>일시정지</h2><div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">처음 화면</button></div></div></div>
<div class="overlay" id="endOv" hidden><div class="card"><h1 id="eTitle">층 클리어!</h1><p id="eTxt"></p><div class="btns"><button class="btn" id="nextBtn">다음 층으로</button><button class="btn soft" id="eMenu">처음 화면</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body></html>
