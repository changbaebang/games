<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>자연재해 살아남기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud"><div id="hpBox">❤️<div class="bar"><i id="hpFill"></i></div></div><div id="ptBox">⭐ <b id="ptTxt">0</b></div><div id="aliveBox">🙂 <b id="aliveTxt">7</b></div></div>
<div id="stage"></div>
<div id="meters"><div id="airBox" hidden>🫧<div class="bar"><i id="airFill"></i></div></div><div id="coldBox" hidden>🥶<div class="bar"><i id="coldFill"></i></div></div></div>
<button id="menuBtn" aria-label="메뉴">≡</button>
<div id="toast"></div>
<div id="banner"></div>
<div class="pad" id="leftPad"><button id="lBtn">◀</button><button id="rBtn">▶</button></div>
<div class="pad" id="rightPad"><button id="appleBtn" hidden>🍎</button><button id="jBtn">⬆</button></div>
<div class="help">←→·AD 이동 · ↑·W·Space 점프(물속에선 헤엄) · E 사과</div>
<div class="overlay" id="titleOv"><div class="card">
  <div class="logo">🌪️🏠🌋</div>
  <h1>자연재해 살아남기</h1>
  <p>섬 마을에 <b>재난</b>이 찾아와요! 경고를 보고 알맞은 곳으로 피해서 끝까지 살아남아요.</p>
  <p class="small">홍수엔 높은 곳, 따끔 비엔 지붕 아래, 회오리엔 멀리! 살아남으면 별점을 받아 풍선·사과·모자를 사요. 동물 친구들과 함께해요.</p>
  <div class="btns"><button class="btn" id="startBtn">섬으로 가기</button></div>
  <p class="small" id="tRec"></p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="lobbyOv" hidden><div class="card wide"><h2 id="lTitle">🏝️ 대기실</h2><p id="lCount"></p><div id="vote"></div><div class="btns"><button class="btn soft" id="shopBtn">🛒 상점</button><button class="btn soft" id="bookBtn">📖 재난 도감</button></div><p class="small" id="lStat"></p></div></div>
<div class="overlay" id="panel" hidden><div class="card wide"><h2 id="pTitle"></h2><div id="pBody"></div><div class="btns" id="pBtns"></div></div></div>
<script src="game.js"></script>
</body></html>
