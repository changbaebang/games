<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>100개의 문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head><body>
<canvas id="c"></canvas>
<div class="hud"><div id="roomBox">🚪 <b id="roomTxt">1</b></div><div id="hearts"></div><div>🪙 <b id="goldTxt">0</b></div><div id="itemsBox"></div></div>

<div class="overlay" id="titleOv"><div class="card">
  <div class="logo">🚪🚪🚪</div>

  <p class="small">불이 깜빡이면 <b>후다닥 구름</b>이 와요 → 옷장이나 침대 밑에 숨어요! 어두운 방에서 "쉿!" 소리가 나면 <b>깍꿍이</b>를 눌러 쳐다봐요. 서랍에서 금화와 열쇠를 찾아요.</p>
  <div class="btns"><button class="btn" id="contBtn" hidden>이어 하기</button><button class="btn" id="newBtn">1번 문부터</button></div>
  <p class="small" id="tRec"></p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="panel" hidden><div class="card"><h2 id="pTitle"></h2><div id="pBody"></div><div class="btns" id="pBtns"></div></div></div>
<script src="game.js"></script>
