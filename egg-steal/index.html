<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>계란 훔치기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="chip coins"><i class="coin"></i><b id="hCoins">0</b><small id="hRate">+0/초</small></div>
  <div class="chip" id="hCarry" hidden></div>
</div>
<button class="tb" id="shopBtn">가게</button>
<button class="act" id="actBtn" hidden></button>
<div id="toast"></div>

<div class="overlay" id="titleOv"><div class="card">
  <h1>계란 훔치기</h1>
  <p>경비가 지키는 둥지에서 몰래 알을 훔쳐 기지로 가져오세요. 부화한 펫이 금화를 벌어 주고, 금화로 신발을 사고 새 지역 문을 열 수 있어요.</p>
  <ul class="how">
    <li><b>이동</b> 화면을 끌거나 WASD · 방향키</li>
    <li><b>훔치기</b> 둥지 위로 지나가면 알을 들어요</li>
    <li><b>조심</b> 노란 시야에 들키면 쫓아와요. 잡히면 알을 놓고 기지로!</li>
    <li><b>부화</b> 기지의 부화기 위에 알을 내려놓아요</li>
  </ul>
  <div class="btns"><button class="btn" id="contBtn" hidden>이어 하기</button><button class="btn" id="newBtn">처음부터</button></div>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>

<div class="overlay" id="shopOv" hidden><div class="card wide">
  <div class="shopHead"><h2>기지 가게</h2><button class="x" id="shopClose" aria-label="닫기">닫기</button></div>
  <p class="money">가진 금화 <b id="sCoins">0</b></p>
  <div class="ups" id="ups"></div>
  <h3>내 펫 <small id="penInfo"></small></h3>
  <div class="pets" id="petList"></div>
</div></div>

<script src="game.js"></script>
</body></html>
