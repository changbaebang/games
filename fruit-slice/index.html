<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>과일 쓱싹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud"><span>점수 <b id="hScore">0</b></span><span id="hLife"></span></div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="big"></div>
<div class="overlay" id="titleOv"><div class="card">
  <h1>과일 쓱싹</h1>
  <p>날아오르는 과일을 손가락으로 <b>쓱</b> 그어 잘라요! 한 번에 여러 개 자르면 <b>콤보</b>. 💣 폭탄은 건드리면 안 돼요.</p>
  <div class="modes"><button class="btn" id="goClassic">기본 모드<small>과일 3개 놓치면 끝</small></button><button class="btn blue" id="goTime">60초 모드<small>폭탄은 -10초</small></button></div>
  <p class="small" id="tRec"></p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card"><h2>일시정지</h2><div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">그만하기</button></div></div></div>
<div class="overlay" id="overOv" hidden><div class="card"><h1 id="oTitle">끝!</h1><p id="oTxt"></p><div class="btns"><button class="btn" id="againBtn">한 판 더</button><button class="btn soft" id="oMenu">처음 화면</button></div></div></div>
<script src="game.js"></script>
</body></html>
