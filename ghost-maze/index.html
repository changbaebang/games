<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>유령 미로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud"><span>점수 <b id="hScore">0</b></span><span id="hLv">1단계</span><span id="hLife"></span></div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="big"></div>
<div class="help">방향키·WASD로 방향 바꾸기 · P 일시정지</div>
<div class="overlay" id="titleOv"><div class="card">
  <h1>유령 미로</h1>
  <p><b>냠냠이</b>가 미로의 씨앗을 모두 먹으면 다음 단계! 유령에게 잡히면 안 돼요.</p>
  <p class="small">반짝이는 <b>힘 열매</b>를 먹으면 유령이 파랗게 겁먹어요. 그때는 유령을 잡을 수 있어요! 양쪽 끝 길은 반대편으로 이어져요.</p>
  <button class="btn" id="startBtn">시작!</button>
  <p class="small" id="tRec"></p>
  <p class="small mob">화면 어디든 가고 싶은 방향으로 쓱 밀어요.</p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card"><h2>일시정지</h2><div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">그만하기</button></div></div></div>
<div class="overlay" id="overOv" hidden><div class="card"><h1 id="oTitle">끝!</h1><p id="oTxt"></p><div class="btns"><button class="btn" id="againBtn">다시 하기</button><button class="btn soft" id="oMenu">처음 화면</button></div></div></div>
<script src="game.js"></script>
</body></html>
