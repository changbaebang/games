<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>구구단 풍선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="wrap"><canvas id="c"></canvas></div>

<div class="overlay" id="titleOv"><div class="card">
  <h1>구구단 풍선</h1>
  <p>답이 적힌 풍선을 콕 눌러 터뜨려요.<br>한 판에 20문제, 하트는 5개!</p>
  <div class="lbl"><span>연습할 단</span><button class="link" id="allBtn">모두 고르기</button></div>
  <div class="chips" id="dans"></div>
  <div class="lbl"><span>풍선 속도</span></div>
  <div class="chips three" id="spd"></div>
  <button class="btn" id="startBtn">시작하기</button>
  <div class="row"><button class="sub" id="stampBtn">도장판 보기</button></div>
  <p class="small"><a href="../">← 게임 목록으로</a></p>
</div></div>

<div class="overlay" id="endOv" hidden><div class="card">
  <div class="stars" id="eStars">★★★</div>
  <h1 id="eTitle">참 잘했어요!</h1>
  <div class="big" id="eScore">0</div>
  <p id="eTxt"></p>
  <div class="lbl" id="eMissLbl" style="justify-content:center"><span>다시 볼 문제</span></div>
  <div class="miss" id="eMiss"></div>
  <button class="btn" id="againBtn">다시 하기</button>
  <div class="row"><button class="sub" id="menuBtn">단 바꾸기</button><button class="sub" id="stamp2Btn">도장판 보기</button></div>
</div></div>

<div class="overlay" id="stampOv" hidden><div class="card wide">
  <h2>구구단 도장판</h2>
  <p id="stampHow">한 번 맞히면 답이 나타나고, 3번 맞히면 도장을 쾅!</p>
  <div class="board" id="board"></div>
  <p id="stampCount">도장 0 / 72</p>
  <button class="btn" id="stampClose" style="margin-top:4px">닫기</button>
  <p class="small"><button class="link" id="resetBtn">도장판 지우기</button></p>
</div></div>

<script src="game.js"></script>
</body></html>
