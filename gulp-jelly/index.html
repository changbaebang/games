<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>꿀꺽 젤리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud"><span id="hearts"></span><span class="ab" id="ability">능력 없음</span><span>별 <b id="stars">0</b></span></div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="toast"></div>
<div class="help">← → 이동 · Space/W 점프(공중에서 또 누르면 둥실) · J 빨아들이기/뱉기/능력 · S 삼키기 · K 능력 버리기 · P 일시정지</div>
<div id="touch"><button class="tb" id="tL">◀</button><button class="tb" id="tR">▶</button><button class="tb" id="tDown">삼키기</button><button class="tb big" id="tAct">흡!</button><button class="tb big" id="tJump">점프</button></div>
<div class="overlay" id="titleOv"><div class="card">
  <h1>꿀꺽 젤리</h1>
  <p>동글동글 젤리가 적을 <b>흡!</b> 빨아들여요. 뱉어서 별로 맞히거나, <b>삼키면</b> 그 적의 능력(불꽃·얼음·칼)을 따라 써요. 공중에서 점프를 또 누르면 둥실둥실 날아요!</p>
  <div class="lv" id="levels"></div>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card"><h2>일시정지</h2><div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">단계 고르기</button></div></div></div>
<div class="overlay" id="endOv" hidden><div class="card"><h1 id="eTitle">도착!</h1><p id="eTxt"></p><div class="btns"><button class="btn" id="nextBtn">다음 단계</button><button class="btn soft" id="retryBtn">다시 하기</button><button class="btn soft" id="eMenu">단계 고르기</button></div></div></div>
<script src="game.js"></script>
</body></html>
