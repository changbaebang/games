<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>흑백 저택 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud"><div id="hearts"></div><div id="keysBox"></div><div id="codeBox"></div></div>
<div id="quest"></div>
<div id="warn"></div>
<button id="menuBtn" aria-label="메뉴">≡</button>
<div id="toast"></div>
<div id="banner"></div>
<div id="hideBar" hidden><i></i><b>옷장 속… 쉿!</b></div>
<div id="holdBar" hidden><i></i><b id="holdTxt">꾹 누르는 중</b></div>
<button id="actBtn" class="act">행동</button>
<button id="runBtn">달리기</button>
<button id="radarBtn" hidden>📡</button>
<div class="help">WASD·방향키 이동 · Space 꾹 누르기(판자 떼기·서랍 뒤지기·숨기) · Shift 달리기(시끄러워요) · R 레이더</div>
<div class="overlay" id="titleOv"><div class="card">
  <div class="logo">🔑🔑🔑🔑</div>
  <h1>흑백 저택 탈출</h1>
  <p>색을 잃은 저택에 갇혔어요! 아래층 서랍장에서 <b>색깔 열쇠 4개</b>와 <b>번호 쪽지</b>를 찾아 엘리베이터로 탈출해요.</p>
  <p class="small">뿔뿔이가 복도를 돌아다녀요. 쿵쿵 발소리가 들리면 <b>옷장</b>에 숨어요! 달리면 들켜요. 열쇠를 꽂을 때마다 세상에 색이 돌아와요.</p>
  <div class="btns" id="startBtns"></div>
  <p class="small" id="tRec"></p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="panel" hidden><div class="card"><h2 id="pTitle"></h2><div id="pBody"></div><div class="btns" id="pBtns"></div></div></div>
<script src="game.js"></script>
</body></html>
