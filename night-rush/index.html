<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>나이트 러시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="game"></div>
<div id="flash"></div>
<div class="hud">
  <div class="panel pos"><b id="pos">6</b><span id="posOf">/ 6등</span></div>
  <div class="panel"><span id="lapLbl">랩</span> <b id="lap">1 / 3</b></div>
  <div class="panel"><b id="time">0:00.0</b></div>
</div>
<div id="chaseHud" hidden>
  <div class="meter bust"><span>체포</span><div><i id="bustFill"></i></div></div>
  <div class="meter esc"><span>탈출</span><div><i id="escFill"></i></div></div>
  <div id="stars"></div>
</div>
<canvas id="map" width="150" height="150"></canvas>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="speedBox"><b id="speed">0</b><small>km/h</small><div id="nitroBar"><i id="nitroFill"></i></div></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="count"></div>
<div id="missionBox" hidden><b>미션</b><ul id="mList"></ul></div>
<div class="help">← → 핸들 · Space 드리프트 · ↓ 브레이크 · Shift 니트로 · P 일시정지 · 가속은 자동</div>
<div id="touch">
  <div id="steerZone"></div>
  <div id="steerInd"><i id="steerKnob"></i></div>
  <button class="tb dir" id="tL" aria-label="왼쪽">◀</button><button class="tb dir" id="tR" aria-label="오른쪽">▶</button>
  <button class="tb" id="tDrift">드리프트<small>브레이크</small></button>
  <button class="tb" id="tNitro">니트로</button>
</div>

<div class="overlay" id="titleOv"><div class="card wide">
  <h1>나이트 러시</h1>
  <p class="coins">금화 <b id="tCoins">0</b></p>
  <div class="seg" id="modeSeg" role="tablist"><button data-m="race" class="on">레이스</button><button data-m="chase">경찰 추격</button></div>
  <p class="modeDesc" id="modeDesc"></p>
  <div class="tracks" id="tracks"></div>
  <div class="carRow"><span>내 차 <b id="tCar">스트리트 GT</b></span><button class="btn soft small" id="garageBtn">차고</button></div>
  <div class="setting" id="ctrlRow"><span>조종</span><div class="seg mini" id="ctrlSeg"><button data-c="drag">드래그</button><button data-c="buttons">버튼</button><button data-c="tilt">기울이기</button></div></div>
  <div class="setting"><span>운전 도움</span><button class="toggle" id="assistBtn" aria-pressed="true">켜짐</button></div>
  <p class="small" id="ctrlHelp"></p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>

<div class="overlay" id="garageOv" hidden><div class="card wide">
  <h2>차고</h2>
  <p class="coins">금화 <b id="gCoins">0</b></p>
  <div class="cars" id="cars"></div>
  <p class="label">색깔</p>
  <div class="colors" id="colors"></div>
  <p class="label">차 밑 네온 <span class="small" id="starTotal"></span></p>
  <div class="neons" id="neons"></div>
  <button class="btn" id="garageClose">다 골랐어요</button>
</div></div>

<div class="overlay" id="pauseOv" hidden><div class="card">
  <h2>일시정지</h2>
  <ul class="missions" id="pMissions"></ul>
  <div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="restartBtn">다시 시작</button><button class="btn soft" id="quitBtn">처음 화면</button></div>
</div></div>

<div class="overlay" id="resultOv" hidden><div class="card">
  <h1 id="resTitle">1등!</h1>
  <p id="resTxt"></p>
  <ul class="missions" id="rMissions"></ul>
  <ol class="resList" id="resList"></ol>
  <div class="btns"><button class="btn" id="nextBtn">다음 트랙</button><button class="btn soft" id="againBtn">다시 하기</button><button class="btn soft" id="resTitleBtn">처음 화면</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body></html>
