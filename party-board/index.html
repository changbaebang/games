<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>파티 보드게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div id="side"></div>
<div id="round"></div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="hint"></div>
<div id="big"></div>

<div class="overlay" id="askOv" hidden><div class="card"><h2 id="askT">별을 살까요?</h2><p id="askP"></p><div class="btns"><button class="btn" id="askYes">살래요!</button><button class="btn soft" id="askNo">안 살래요</button></div></div></div>
<div class="overlay" id="titleOv"><div class="card">
  <h1>파티 보드게임</h1>
  <p>주사위를 굴려 보드를 돌며 <b>코인</b>을 모으고, 코인 <b id="tCost">20</b>개로 <b>⭐ 별</b>을 사요. 라운드마다 미니게임 한 판!</p>
  <p class="small">파란 칸 코인 +, 빨간 칸 코인 −, <b>?</b> 칸은 깜짝 이벤트. 별을 가장 많이 모은 사람이 우승!</p>
  <div class="rounds" id="rounds"></div>
  <button class="btn" id="startBtn">파티 시작!</button>
  <p class="small" id="tRec"></p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card"><h2>일시정지</h2><div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">그만하기</button></div></div></div>
<div class="overlay" id="overOv" hidden><div class="card"><h1 id="oTitle">우승!</h1><div id="oRank"></div><div class="btns"><button class="btn" id="againBtn">한 판 더</button><button class="btn soft" id="oMenu">처음 화면</button></div></div></div>
<script src="game.js"></script>
</body></html>
