<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>규칙 기차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
  <div class="top"><button class="pill" id="menuBtn">← 단계</button><div class="stg" id="stgName"></div><span class="sp"></span></div>
  <div class="dots" id="dots"></div>
  <h2 class="ask" id="ask"></h2>
  <div class="scene" id="scene"></div>
  <div class="choices" id="choices"></div>
</div>
<div class="fb" id="fb" hidden><h3 id="fbTitle"></h3><p id="fbText"></p><button class="btn" id="nextBtn">다음 기차</button></div>

<div class="overlay" id="titleOv"><div class="card">
  <div class="logo" id="logo" aria-hidden="true"></div>
  <h1>규칙 기차</h1>
  <p>기차 칸에 숨은 규칙을 찾아서<br><b>?</b> 칸에 올 것을 골라요.</p>
  <div class="stages" id="stages"></div>
  <p class="small"><a href="../">← 게임 목록으로</a></p>
</div></div>

<div class="overlay" id="endOv" hidden><div class="card">
  <div class="stars" id="eStars"></div>
  <h1 id="eTitle"></h1>
  <p id="eTxt" style="white-space:pre-line"></p>
  <button class="btn" id="nextStageBtn">다음 단계</button>
  <div class="row"><button class="sub" id="againBtn">다시 하기</button><button class="sub" id="pickBtn">단계 고르기</button></div>
</div></div>

<script src="game.js"></script>
</body></html>
