<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>솜뭉치 날리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud"><span id="hLv">1단계</span><span>점수 <b id="hScore">0</b></span></div>
<div id="queue"></div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<button id="retryBtn" aria-label="다시">↻</button>
<div id="hint"></div>
<div id="big"></div>
<div class="overlay" id="titleOv"><div class="card">
  <h1>솜뭉치 날리기</h1>
  <p>새총을 <b>뒤로 당겼다 놓아</b> 솜뭉치를 날려요! 블록을 무너뜨려 <b>투덜 버섯</b>을 모두 터뜨리면 성공.</p>
  <p class="small">날아가는 중에 화면을 탭하면 특기! 노랑은 쌩, 파랑은 셋으로, 검정은 쾅!</p>
  <div class="lv" id="lvs"></div>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card"><h2>일시정지</h2><div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">단계 고르기</button></div></div></div>
<div class="overlay" id="overOv" hidden><div class="card"><h1 id="oTitle">성공!</h1><div id="oStars"></div><p id="oTxt"></p><div class="btns"><button class="btn" id="againBtn">다음 단계</button><button class="btn soft" id="redoBtn">다시 하기</button><button class="btn soft" id="oMenu">단계 고르기</button></div></div></div>
<script src="game.js"></script>
</body></html>
