<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>철길 질주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="game"></div>
<div id="flash"></div>
<div class="hud">
  <div class="panel score"><b id="score">0</b><span id="mult">×1</span></div>
  <div class="panel"><span class="coin"></span><b id="coins">0</b></div>
  <div id="powers"></div>
</div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="toast"></div>
<div class="help">← → 줄 바꾸기 · ↑/Space 점프 · ↓ 구르기 · P 일시정지</div>
<p class="swipeHint" id="swipeHint">화면을 밀어서 움직여요 ← → ↑ ↓</p>

<div class="overlay" id="titleOv"><div class="card">
  <h1>철길 질주</h1>
  <p>기차와 울타리를 피해 끝없이 달려요! 동전을 모으고, 기차 지붕 위로도 달릴 수 있어요.</p>
  <p class="best">최고 점수 <b id="tBest">0</b> · 동전 <b id="tCoins">0</b></p>
  <div class="missionBox"><b>미션 · 점수 배수 <span id="tMult">×1</span></b><ul id="tMissions"></ul></div>
  <div class="btns"><button class="btn" id="startBtn">달리기!</button><button class="btn soft" id="shopBtn">아이템 강화</button></div>
  <p class="small mob">화면을 왼쪽·오른쪽으로 밀면 줄 바꾸기, 위로 밀면 점프, 아래로 밀면 구르기.</p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="shopOv" hidden><div class="card">
  <h2>아이템 강화</h2>
  <p>동전 <b id="sCoins">0</b> · 강화하면 아이템이 더 오래가요.</p>
  <div class="ups" id="ups"></div>
  <button class="btn" id="shopClose">다 했어요</button>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card">
  <h2>일시정지</h2><ul class="mlist" id="pMissions"></ul>
  <div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">처음 화면</button></div>
</div></div>
<div class="overlay" id="overOv" hidden><div class="card">
  <h1 id="overTitle">쾅!</h1>
  <p class="big"><b id="oScore">0</b>점</p>
  <p id="oTxt"></p>
  <ul class="mlist" id="oMissions"></ul>
  <div class="btns"><button class="btn" id="againBtn">다시 달리기</button><button class="btn soft" id="oTitle">처음 화면</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body></html>
