<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>하늘 점프맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="game"></div>
<div id="fade"></div>
<div class="hud">
  <div class="panel"><b id="stName">1. 첫걸음 언덕</b></div>
  <div class="panel row"><span>시간 <b id="time">0.0</b></span><span>넘어짐 <b id="deaths">0</b></span><span>별 <b id="stars">0/3</b></span></div>
</div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="toast"></div>
<div class="help">WASD 이동 · Space 점프 · 드래그/←→ 시점 · R 체크포인트로 · P 일시정지</div>
<div id="touch"><div id="joy"><div id="knob"></div></div><button id="tJump">점프</button></div>

<div class="overlay" id="titleOv"><div class="card">
  <h1>하늘 점프맵</h1>
  <p>구름 위 블록 길을 점프로 건너 깃발까지 가요. 떨어져도 초록 체크포인트에서 다시 시작해요.</p>
  <div class="stages" id="stageList"></div>
  <p class="small mob">왼쪽 아래를 눌러 이동, 오른쪽을 끌어 시점 회전, 점프 버튼으로 점프.</p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card">
  <h2>일시정지</h2>
  <div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="checkBtn">체크포인트로 가기</button><button class="btn soft" id="restartBtn">처음부터</button><button class="btn soft" id="quitBtn">단계 고르기</button></div>
</div></div>
<div class="overlay" id="clearOv" hidden><div class="card">
  <h1 id="clrTitle">도착!</h1>
  <p class="big" id="clrStars">★★★</p>
  <p id="clrTxt"></p>
  <div class="btns"><button class="btn" id="nextBtn">다음 단계</button><button class="btn soft" id="againBtn">다시 하기</button><button class="btn soft" id="clrQuit">단계 고르기</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body></html>
