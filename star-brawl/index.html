<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>별빛 대난투</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div id="cards"></div>
<button id="pauseBtn" aria-label="일시정지">II</button>
<div id="big"></div>
<div class="help">←→ 이동 · ↑ 또는 Space 점프(두 번까지) · J 공격 · K 필살기 (↑+K 위로 솟기) · P 일시정지</div>
<div id="touch"><div id="stickZone"><div id="stick"><i></i></div></div><div class="tbtns"><button id="bB">필살</button><button id="bA">공격</button><button id="bJ">점프</button></div></div>

<div class="overlay" id="titleOv"><div class="card">
  <h1>별빛 대난투</h1>
  <p>상대의 <b>%</b>를 쌓을수록 멀리 날아가요. 화면 밖으로 날려 보내 <b>목숨</b>을 모두 없애면 승리!</p>
  <div class="pick" id="picks"></div>
  <p class="small" id="pDesc"></p>
  <button class="btn" id="startBtn">난투 시작!</button>
  <p class="small" id="tRec"></p>
  <p class="small mob">왼쪽을 끌어 움직이고 위로 튕기면 점프, 오른쪽 버튼으로 공격·필살기. 위로 끈 채 필살기 = 위로 솟아올라 복귀!</p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="pauseOv" hidden><div class="card"><h2>일시정지</h2><div class="btns"><button class="btn" id="resumeBtn">계속하기</button><button class="btn soft" id="quitBtn">그만하기</button></div></div></div>
<div class="overlay" id="overOv" hidden><div class="card"><h1 id="oTitle">승리!</h1><p id="oTxt"></p><div class="btns"><button class="btn" id="againBtn">한 판 더</button><button class="btn soft" id="oMenu">캐릭터 고르기</button></div></div></div>
<script src="game.js"></script>
</body></html>
