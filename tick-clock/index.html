<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>똑딱 시계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
  <div class="top"><button class="pill" id="menuBtn">← 단계</button><div class="stg" id="stgName"></div><button class="pill" id="helpBtn" aria-pressed="false">도움 숫자</button></div>
  <div class="dots" id="dots"></div>
  <div class="q" id="qText"></div>
  <div class="vis">
    <div class="cw" id="mainWrap"></div>
    <div class="pair" id="pairWrap" hidden><figure><div id="c1"></div><figcaption>시작</figcaption></figure><span class="arrow">→</span><figure><div id="c2"></div><figcaption>끝</figcaption></figure></div>
    <div class="bigtext" id="bigText" hidden></div>
  </div>
  <div class="ans" id="ans"></div>
</div>
<div class="fb" id="fb" hidden><h3 id="fbTitle"></h3><p id="fbText"></p><button class="btn" id="nextBtn">다음 문제</button></div>

<div class="overlay" id="titleOv"><div class="card">
  <h1>똑딱 시계</h1>
  <p>시계를 읽고, 바늘을 돌려 맞추고, 시간을 계산해요.<br>단계마다 10문제!</p>
  <div class="stages" id="stages"></div>
  <p class="small"><a href="../">← 게임 목록으로</a></p>
</div></div>

<div class="overlay" id="endOv" hidden><div class="card">
  <div class="stars" id="eStars"></div>
  <h1 id="eTitle"></h1>
  <p id="eTxt"></p>
  <button class="btn" id="nextStageBtn">다음 단계</button>
  <div class="row"><button class="sub" id="againBtn">다시 하기</button><button class="sub" id="pickBtn">단계 고르기</button></div>
</div></div>

<script src="game.js"></script>
</body></html>
