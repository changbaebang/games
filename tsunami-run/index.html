<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>쓰나미 탈출 말랑이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../common/arcade.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div class="hud"><div id="coinBox">🪙 <b id="coinTxt">0</b></div><div id="incBox">+<b id="incTxt">0</b>/초</div><div id="carryBox">🎒 <b id="carryTxt">0/1</b></div></div>
<div id="waveBar"><b id="waveTxt">다음 파도</b><div class="bar"><i id="waveFill"></i></div></div>
<div id="quest"></div>
<div id="warn"></div>
<div class="sideBtns"><button id="menuBtn" aria-label="메뉴">≡</button><button id="shopBtn">🛒</button><button id="dexBtn">📖</button></div>
<div id="toast"></div>
<div id="banner"></div>
<div class="help">WASD·방향키 이동 · 위로 달려가 말랑이를 줍고 기지로 돌아와요 · 파도가 오면 벽 구멍 🛟 에 숨어요</div>
<div class="overlay" id="titleOv"><div class="card">
  <div class="logo">🌊🏃🍡</div>
  <h1>쓰나미 탈출 말랑이</h1>
  <p>길 끝으로 달려가 <b>말랑이</b>를 주워 기지로 데려와요. 기지의 말랑이는 매초 금화를 벌어요!</p>
  <p class="small">멀리 갈수록 귀한 말랑이가 있어요. 그런데 <b>파도</b>가 와요! 파도가 오면 벽의 🛟 구멍에 쏙 숨어요. 파도에 휩쓸리면 들고 있던 말랑이를 놓쳐요.</p>
  <div class="btns"><button class="btn" id="startBtn">시작하기</button></div>
  <p class="small" id="tRec"></p>
  <p class="back"><a href="../">← 게임 목록으로</a></p>
</div></div>
<div class="overlay" id="panel" hidden><div class="card wide"><h2 id="pTitle"></h2><div id="pBody"></div><div class="btns" id="pBtns"></div></div></div>
<script src="game.js"></script>
</body></html>
